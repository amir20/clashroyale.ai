# Rook in production, on the NAS (krazyraminfars) in /volume2/docker/rook.
# Don't edit the copy on the NAS: scripts/deploy copies this file there on every deploy.
# The image is built on the NAS's Docker by scripts/deploy (docker context "krazyraminfars"),
# tagged rook:<commit> and rook:latest. Secrets stay in .env on the NAS, next to this file.

x-rook: &rook
  image: rook:latest
  pull_policy: never # built on the NAS itself, never pulled
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data

services:
  rook:
    <<: *rook
    container_name: rook
    mem_limit: 16g
    environment:
      - CRAI_ANALYTICS_DAYS=8
      - CRAI_DEV=1 # no daily question limit, AI cost shown on the page
    ports:
      - "8787:8000"
    labels:
      - dev.dozzle.name=Rook
      - dev.dozzle.url=http://ugreen-nas.tail40338f.ts.net:8787
      - dev.dozzle.icon=data:image/svg+xml;base64,

  crawler:
    <<: *rook
    container_name: rook-crawler
    mem_limit: 3g
    depends_on:
      - rook
    healthcheck:
      disable: true
    command:
      - sh
      - -c
      - |
        while true; do
          echo "next crawl in 2 hours"
          sleep 7200
          crai crawl --top 1000 --max-players 40000 --refresh-hours 6 --tracked-refresh-hours 2
          crai prune --days 14
        done
    labels:
      - dev.dozzle.name=Rook Crawler
      - dev.dozzle.icon=data:image/svg+xml;base64,
