[project]
name = "crai"
version = "0.1.0"
description = "Clash Royale battle crawler, deck analytics and MCP server"
readme = "README.md"
authors = [
    { name = "Amir Raminfar", email = "findamir@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "polars>=2.1.0",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
crai = "crai.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
ml = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET", "PTH", "PERF",
    "ASYNC", "LOG", "G", "TC", "ANN", "FBT003", "PL", "S608",
]
ignore = [
    "PLR0913",  # analytics functions take many keyword-only filters by design
    "PLR2004",  # magic numbers (thresholds) read fine inline
    "PLR0915", "PLR0912", "PLR0911",  # match-based formatters return per case
    "ANN401",   # JSON payloads are Any at the boundary
    "S608",     # SQL is built from fixed fragments + bound params, never user strings
    "PLR0917",  # CLI/MCP tool params map 1:1 to options
    "TC001", "TC002", "TC003", "TC006",  # PEP 649 lazily evaluates annotations; no TYPE_CHECKING dance
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR", "S"]

[tool.ty.environment]
python-version = "3.15"

[[tool.ty.overrides]]
# torch and numpy come with the optional `ml` group, which CI and the server image don't install.
include = ["src/crai/ml/model.py", "src/crai/ml/train.py"]
[tool.ty.overrides.rules]
import-not-found = "ignore"

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
filterwarnings = ["error"]
