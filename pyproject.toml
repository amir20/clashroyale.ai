[project]
name = "crai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amir Raminfar", email = "findamir@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "polars>=2.1.0",
    "typer>=0.28.0",
]

[project.scripts]
crai = "crai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
